<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://sdk.minepi.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://socialchain.app https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com; img-src 'self' data:;" />
  <title>Pollux Pixel RPG</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0; background: #0d0e15; color: #fff;
      font-family: monospace; display: flex; flex-direction: column;
      align-items: center; justify-content: center; height: 100vh; overflow: hidden;
    }
    #hud {
      width: 100%; max-width: 512px; display: flex; justify-content: space-between;
      align-items: center; padding: 8px 10px; background: #181926; border: 2px solid #353852;
      font-size: 12px; gap: 6px;
    }
    .stats { display: flex; gap: 10px; align-items: center; font-weight: bold; }
    .gold-txt { color: #fde047; }
    .hp-txt { color: #f87171; }
    .hud-btns { display: flex; gap: 6px; align-items: center; }
    .shop-toggle {
      background: #7c3aed; color: #fff; padding: 6px 10px;
      font-weight: bold; border-radius: 4px; cursor: pointer; border: 1px solid #c4b5fd;
      font-family: monospace; font-size: 12px;
    }
    .pi-badge {
      background: #ffb700; color: #111; padding: 6px 10px;
      font-weight: bold; border-radius: 4px; cursor: pointer; border: none;
      font-family: monospace; font-size: 11px;
    }
    #game-wrap {
      position: relative; width: 100%; max-width: 512px; aspect-ratio: 1 / 1;
    }
    canvas {
      width: 100%; height: 100%; display: block;
      background: #1e2d24; border: 2px solid #353852;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    #shop-modal {
      display: none; position: absolute; inset: 12px;
      background: rgba(15, 17, 28, 0.96); border: 2px solid #facc15;
      border-radius: 8px; padding: 14px; flex-direction: column;
      justify-content: space-between; z-index: 10;
    }
    #shop-modal.open { display: flex; }
    .shop-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #353852; padding-bottom: 8px; font-size: 15px;
      color: #fde047; font-weight: bold;
    }
    .close-shop {
      background: #ef4444; color: #fff; border: none; border-radius: 4px;
      padding: 4px 10px; font-family: monospace; font-weight: bold; cursor: pointer;
    }
    .shop-items { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; overflow-y: auto; }
    .shop-card {
      display: flex; justify-content: space-between; align-items: center;
      background: #1f2233; border: 1px solid #3f4464; padding: 8px 10px; border-radius: 6px;
    }
    .item-info { display: flex; flex-direction: column; gap: 3px; }
    .item-title { font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .item-desc { font-size: 11px; color: #9ca3af; }
    .buy-btn {
      background: #facc15; color: #111; border: none; padding: 6px 10px;
      border-radius: 4px; font-family: monospace; font-weight: bold; font-size: 11px; cursor: pointer;
    }
    .buy-btn:disabled { background: #374151; color: #9ca3af; cursor: default; }
    #controls {
      width: 100%; max-width: 512px; display: flex; justify-content: space-between;
      align-items: center; padding: 10px 20px;
    }
    .dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px; }
    .btn {
      background: #23263a; border: 2px solid #4a4f70; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 16px; border-radius: 6px; touch-action: manipulation;
    }
    .btn:active { background: #ffb700; color: #000; }
    .atk-btn {
      width: 86px; height: 86px; border-radius: 50%; background: #991b1b;
      border: 3px solid #f87171; font-size: 14px; box-shadow: 0 0 12px rgba(248,113,113,0.4);
    }
  </style>
</head>
<body>

  <div id="hud">
    <div class="stats">
      <span class="hp-txt">♥ <span id="hp">100</span></span>
      <span class="gold-txt">🪙 <span id="gold">0</span>G</span>
      <span id="swordName" style="color:#fef08a;">Lv1 Blade</span>
    </div>
    <div class="hud-btns">
      <button class="shop-toggle" id="shopBtn">🛒 SHOP</button>
      <button class="pi-badge" id="piLoginBtn">Tap to Sign In</button>
    </div>
  </div>

  <div id="game-wrap">
    <canvas id="game" width="160" height="160"></canvas>

    <div id="shop-modal">
      <div class="shop-header">
        <span>⚒️ POLLUX ARMORY</span>
        <button class="close-shop" id="closeShopBtn">X</button>
      </div>
      <div class="shop-items" id="shopList"></div>
      <div style="font-size:11px; color:#9ca3af; text-align:center;">
        Slay Goblins (+8G) & Dark Knights (+18G) to forge stronger blades!
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="dpad">
      <div></div><div class="btn" data-key="ArrowUp">▲</div><div></div>
      <div class="btn" data-key="ArrowLeft">◀</div><div></div><div class="btn" data-key="ArrowRight">▶</div>
      <div></div><div class="btn" data-key="ArrowDown">▼</div><div></div>
    </div>
    <div class="btn atk-btn" data-key="Space">SLASH</div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// --- PI NETWORK AUTHENTICATION ---
let sessionToken = null;
let verifiedUser = null;
let isAuthenticating = false;

function onIncompletePaymentFound(payment) {
  console.log("Incomplete payment found:", payment);
}

async function authenticateWithPi() {
  if (isAuthenticating || sessionToken) return;
  const btn = document.getElementById('piLoginBtn');
  if (typeof window.Pi === 'undefined') {
    btn.textContent = "SDK Loading...";
    return;
  }
  isAuthenticating = true;
  btn.textContent = "Connecting...";
  try {
    await window.Pi.init({ version: "2.0" });
    const authResult = await window.Pi.authenticate(["username"], onIncompletePaymentFound);
    const accessToken = authResult.accessToken;

    const response = await fetch("https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com/pi/auth/v1/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accessToken: accessToken })
    });

    if (!response.ok) throw new Error("Token exchange failed");
    const data = await response.json();
    sessionToken = data.sessionToken;
    verifiedUser = data.user;

    btn.textContent = `@${verifiedUser.username}`;
    btn.style.background = "#4ade80";
  } catch (err) {
    console.error("Auth Error:", err);
    btn.textContent = "Sign In";
  } finally {
    isAuthenticating = false;
  }
}

window.addEventListener('DOMContentLoaded', authenticateWithPi);
document.getElementById('piLoginBtn').addEventListener('click', authenticateWithPi);

// --- SWORD TIERS & SHOP ---
const SWORDS = [
  { level: 1, name: "Sunlit Shortsword", short: "Lv1 Blade", cost: 0, dmg: 1, reach: 15, color: "#fef9c3", glow: "#fde047" },
  { level: 2, name: "Crimson Edge", short: "Lv2 Crimson", cost: 25, dmg: 2, reach: 18, color: "#f87171", glow: "#dc2626" },
  { level: 3, name: "Azure Stormfang", short: "Lv3 Azure", cost: 75, dmg: 4, reach: 21, color: "#60a5fa", glow: "#2563eb" },
  { level: 4, name: "Void Pollux Relic", short: "MAX Void", cost: 200, dmg: 8, reach: 25, color: "#e879f9", glow: "#9333ea" }
];

const player = {
  x: 76, y: 76, w: 10, h: 12, speed: 62, dir: 'down',
  hp: 100, maxHp: 100, gold: 0, swordIdx: 0,
  atkTimer: 0, atkDuration: 0.22, invuln: 0, walkCycle: 0
};

const shopModal = document.getElementById('shop-modal');
const shopList = document.getElementById('shopList');

function updateHUD() {
  document.getElementById('hp').textContent = player.hp;
  document.getElementById('gold').textContent = player.gold;
  const sw = SWORDS[player.swordIdx];
  const swEl = document.getElementById('swordName');
  swEl.textContent = sw.short;
  swEl.style.color = sw.color;
}

function renderShop() {
  shopList.innerHTML = '';
  SWORDS.slice(1).forEach((s, idx) => {
    const actualIdx = idx + 1;
    const owned = player.swordIdx >= actualIdx;
    const canBuy = !owned && player.gold >= s.cost && player.swordIdx === actualIdx - 1;
    const locked = actualIdx > player.swordIdx + 1;

    const card = document.createElement('div');
    card.className = 'shop-card';
    card.innerHTML = `
      <div class="item-info">
        <div class="item-title">
          <span class="color-dot" style="background:${s.color}; box-shadow: 0 0 6px ${s.glow};"></span>
          <span style="color:${s.color}">${s.name}</span>
        </div>
        <div class="item-desc">DMG: ${s.dmg} | Slash: ${s.color === '#f87171' ? 'Red' : s.color === '#60a5fa' ? 'Blue' : 'Purple (MAX)'}</div>
      </div>
      <button class="buy-btn" ${(!canBuy || owned) ? 'disabled' : ''}>
        ${owned ? 'EQUIPPED' : locked ? 'LOCKED' : s.cost + 'G'}
      </button>
    `;
    if (canBuy) {
      card.querySelector('button').addEventListener('click', () => {
        player.gold -= s.cost;
        player.swordIdx = actualIdx;
        updateHUD();
        renderShop();
      });
    }
    shopList.appendChild(card);
  });

  // Health Potion card
  const potionCard = document.createElement('div');
  potionCard.className = 'shop-card';
  const canHeal = player.gold >= 15 && player.hp < player.maxHp;
  potionCard.innerHTML = `
    <div class="item-info">
      <div class="item-title" style="color:#4ade80;">🧪 Royal Elixir</div>
      <div class="item-desc">Restores +50 HP immediately</div>
    </div>
    <button class="buy-btn" ${!canHeal ? 'disabled' : ''}>15G</button>
  `;
  if (canHeal) {
    potionCard.querySelector('button').addEventListener('click', () => {
      player.gold -= 15;
      player.hp = Math.min(player.maxHp, player.hp + 50);
      updateHUD();
      renderShop();
    });
  }
  shopList.appendChild(potionCard);
}

document.getElementById('shopBtn').addEventListener('click', () => {
  renderShop();
  shopModal.classList.toggle('open');
});
document.getElementById('closeShopBtn').addEventListener('click', () => {
  shopModal.classList.remove('open');
});

// --- INPUTS ---
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') triggerAttack();
});
window.addEventListener('keyup', e => keys[e.code] = false);

document.querySelectorAll('.btn').forEach(btn => {
  const k = btn.dataset.key;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (player.hp <= 0) { revivePlayer(); return; }
    keys[k] = true;
    if (k === 'Space') triggerAttack();
  });
  btn.addEventListener('pointerup', e => { e.preventDefault(); keys[k] = false; });
  btn.addEventListener('pointerleave', () => keys[k] = false);
});

canvas.addEventListener('pointerdown', () => {
  if (player.hp <= 0) revivePlayer();
});

function revivePlayer() {
  player.hp = 100;
  player.x = 76; player.y = 76;
  enemies.length = 0;
  for (let i = 0; i < 4; i++) spawnEnemy();
  updateHUD();
}

// --- WORLD, ENEMIES & PARTICLES ---
const enemies = [];
const particles = [];
const floatTexts = [];
const pillars = [
  {x: 24, y: 24, w: 14, h: 16}, {x: 122, y: 24, w: 14, h: 16},
  {x: 24, y: 120, w: 14, h: 16}, {x: 122, y: 120, w: 14, h: 16}
];

const grassTufts = Array.from({length: 28}, () => ({
  x: Math.floor(Math.random() * 146) + 6,
  y: Math.floor(Math.random() * 146) + 6
}));

function spawnEnemy() {
  if (enemies.length >= 6) return;
  const edge = Math.floor(Math.random() * 4);
  const x = edge === 0 ? 6 : edge === 1 ? 142 : Math.random() * 130 + 10;
  const y = edge === 2 ? 6 : edge === 3 ? 142 : Math.random() * 130 + 10;
  const isKnight = Math.random() < 0.28;
  enemies.push({
    x, y, w: 10, h: 12,
    type: isKnight ? 'knight' : 'goblin',
    hp: isKnight ? 6 : 2,
    maxHp: isKnight ? 6 : 2,
    speed: isKnight ? 18 : 25,
    goldReward: isKnight ? 18 : 8,
    knockX: 0, knockY: 0, anim: Math.random() * 10
  });
}
for (let i = 0; i < 4; i++) spawnEnemy();

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function triggerAttack() {
  if (player.atkTimer > 0 || player.hp <= 0 || shopModal.classList.contains('open')) return;
  player.atkTimer = player.atkDuration;
  const sw = SWORDS[player.swordIdx];
  const reach = sw.reach;

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  const hitbox = {
    x: player.dir === 'left' ? cx - reach : player.dir === 'right' ? cx + 2 : cx - reach * 0.7,
    y: player.dir === 'up' ? cy - reach : player.dir === 'down' ? cy + 2 : cy - reach * 0.7,
    w: (player.dir === 'left' || player.dir === 'right') ? reach : reach * 1.4,
    h: (player.dir === 'up' || player.dir === 'down') ? reach : reach * 1.4
  };

  // Spawn slash sparkles
  for (let i = 0; i < 7; i++) {
    particles.push({
      x: hitbox.x + Math.random() * hitbox.w,
      y: hitbox.y + Math.random() * hitbox.h,
      vx: (Math.random() - 0.5) * 45,
      vy: (Math.random() - 0.5) * 45,
      life: 0.22 + Math.random() * 0.12,
      color: i % 2 === 0 ? sw.color : sw.glow
    });
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (aabb(hitbox, e)) {
      e.hp -= sw.dmg;
      const dx = (e.x - player.x) || 1, dy = (e.y - player.y) || 1;
      const len = Math.hypot(dx, dy);
      e.knockX = (dx / len) * 125;
      e.knockY = (dy / len) * 125;

      floatTexts.push({
        x: e.x + 2, y: e.y - 2,
        text: `-${sw.dmg}`, color: sw.color, life: 0.45
      });

      if (e.hp <= 0) {
        player.gold += e.goldReward;
        floatTexts.push({
          x: e.x, y: e.y - 8,
          text: `+${e.goldReward}G`, color: '#fde047', life: 0.65
        });
        enemies.splice(i, 1);
        updateHUD();
        setTimeout(spawnEnemy, 900);
      }
    }
  }
}

// --- PIXEL ART HUMANOID RENDERERS ---
function drawHero(x, y) {
  const px = Math.round(x), py = Math.round(y);
  const sw = SWORDS[player.swordIdx];
  const step = Math.sin(player.walkCycle * 12) > 0 ? 1 : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(px + 1, py + 11, 8, 2);

  // Flowing Red Cape
  ctx.fillStyle = '#b91c1c';
  if (player.dir === 'up') {
    ctx.fillRect(px + 1, py + 4, 8, 6);
  } else {
    ctx.fillRect(px + 1, py + 4, 8, 5);
  }

  // Boots / Animated Legs
  ctx.fillStyle = '#475569';
  ctx.fillRect(px + 2, py + 9 + step, 2, 3 - step);
  ctx.fillRect(px + 6, py + 9 + (1 - step), 2, 3 - (1 - step));

  // Tunic / Armor Torso
  ctx.fillStyle = '#2563eb';
  ctx.fillRect(px + 2, py + 5, 6, 4);
  ctx.fillStyle = '#eab308'; // Gold Belt
  ctx.fillRect(px + 2, py + 8, 6, 1);

  // Knight Helmet & Face
  ctx.fillStyle = '#cbd5e1'; // Silver Helmet
  ctx.fillRect(px + 1, py, 8, 5);
  ctx.fillStyle = '#94a3b8'; // Helmet Crest
  ctx.fillRect(px + 3, py - 1, 4, 1);

  if (player.dir !== 'up') {
    ctx.fillStyle = '#fde68a'; // Face slit
    ctx.fillRect(px + 2, py + 2, 6, 2);
    ctx.fillStyle = '#0f172a'; // Eyes
    const eyeOffset = player.dir === 'left' ? 0 : player.dir === 'right' ? 1 : 0;
    ctx.fillRect(px + 2 + eyeOffset, py + 2, 1, 2);
    ctx.fillRect(px + 6 + eyeOffset, py + 2, 1, 2);
  }

  // Equipped Sword in hand when idle
  if (player.atkTimer <= 0) {
    ctx.fillStyle = sw.color;
    if (player.dir === 'right') ctx.fillRect(px + 8, py + 4, 5, 2);
    else if (player.dir === 'left') ctx.fillRect(px - 3, py + 4, 5, 2);
    else if (player.dir === 'up') ctx.fillRect(px + 8, py + 1, 2, 5);
    else ctx.fillRect(px + 8, py + 5, 2, 5);
  }
}

function drawHumanoidEnemy(e) {
  const ex = Math.round(e.x), ey = Math.round(e.y);
  const step = Math.sin(e.anim * 8) > 0 ? 1 : 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(ex + 1, ey + 11, 8, 2);

  if (e.type === 'goblin') {
    // Goblin Ears & Head
    ctx.fillStyle = '#4d7c0f';
    ctx.fillRect(ex, ey + 2, 10, 2); // Pointy ears
    ctx.fillStyle = '#65a30d';
    ctx.fillRect(ex + 2, ey + 1, 6, 4); // Head
    ctx.fillStyle = '#ef4444'; // Glowing Red Eyes
    ctx.fillRect(ex + 3, ey + 2, 1, 1);
    ctx.fillRect(ex + 6, ey + 2, 1, 1);
    // Leather Armor
    ctx.fillStyle = '#78350f';
    ctx.fillRect(ex + 2, ey + 5, 6, 4);
    // Legs
    ctx.fillStyle = '#3f6212';
    ctx.fillRect(ex + 2, ey + 9 + step, 2, 2);
    ctx.fillRect(ex + 6, ey + 9 + (1 - step), 2, 2);
    // Goblin Dagger
    ctx.fillStyle = '#d1d5db';
    ctx.fillRect(ex - 1, ey + 5, 3, 1);
  } else {
    // Dark Knight (Horned Armor)
    ctx.fillStyle = '#e2e8f0'; // Horns
    ctx.fillRect(ex + 1, ey - 1, 1, 2);
    ctx.fillRect(ex + 8, ey - 1, 1, 2);
    ctx.fillStyle = '#312e81'; // Dark Helm
    ctx.fillRect(ex + 2, ey, 6, 5);
    ctx.fillStyle = '#f43f5e'; // Glowing Visor
    ctx.fillRect(ex + 3, ey + 2, 4, 1);
    // Heavy Plate Body
    ctx.fillStyle = '#1e1b4b';
    ctx.fillRect(ex + 1, ey + 5, 8, 5);
    // Boots
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(ex + 2, ey + 10 + step, 2, 2);
    ctx.fillRect(ex + 6, ey + 10 + (1 - step), 2, 2);
    // Dark Broadsword
    ctx.fillStyle = '#a855f7';
    ctx.fillRect(ex + 9, ey + 3, 2, 6);
  }

  // Mini HP Bar if damaged
  if (e.hp < e.maxHp) {
    ctx.fillStyle = '#111';
    ctx.fillRect(ex + 1, ey - 3, 8, 2);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(ex + 1, ey - 3, Math.ceil((e.hp / e.maxHp) * 8), 2);
  }
}

function drawSwordSlash() {
  if (player.atkTimer <= 0) return;
  const sw = SWORDS[player.swordIdx];
  const progress = 1 - (player.atkTimer / player.atkDuration); // 0 to 1
  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  let baseAngle = 0;
  if (player.dir === 'right') baseAngle = 0;
  else if (player.dir === 'down') baseAngle = Math.PI / 2;
  else if (player.dir === 'left') baseAngle = Math.PI;
  else if (player.dir === 'up') baseAngle = -Math.PI / 2;

  const startArc = baseAngle - 1.15;
  const endArc = baseAngle + 1.15;
  const currentBladeAngle = startArc + (endArc - startArc) * progress;

  ctx.save();
  // Outer Colored Glow Crescent
  ctx.beginPath();
  ctx.arc(cx, cy, sw.reach, startArc, currentBladeAngle);
  ctx.strokeStyle = sw.glow;
  ctx.lineWidth = 5;
  ctx.stroke();

  // Inner Bright Core Slash
  ctx.beginPath();
  ctx.arc(cx, cy, sw.reach - 2, startArc + 0.2, currentBladeAngle);
  ctx.strokeStyle = sw.color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Swinging Physical Sword Blade
  const bx = cx + Math.cos(currentBladeAngle) * (sw.reach + 2);
  const by = cy + Math.sin(currentBladeAngle) * (sw.reach + 2);
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(currentBladeAngle) * 4, cy + Math.sin(currentBladeAngle) * 4);
  ctx.lineTo(bx, by);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

let lastTime = performance.now();
function update(dt) {
  if (player.hp <= 0 || shopModal.classList.contains('open')) return;
  if (player.atkTimer > 0) player.atkTimer -= dt;
  if (player.invuln > 0) player.invuln -= dt;

  let vx = 0, vy = 0;
  if (keys['ArrowUp'] || keys['KeyW']) { vy = -1; player.dir = 'up'; }
  if (keys['ArrowDown'] || keys['KeyS']) { vy = 1; player.dir = 'down'; }
  if (keys['ArrowLeft'] || keys['KeyA']) { vx = -1; player.dir = 'left'; }
  if (keys['ArrowRight'] || keys['KeyD']) { vx = 1; player.dir = 'right'; }

  if (vx !== 0 || vy !== 0) {
    player.walkCycle += dt;
    if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
  }

  const nextX = Math.max(4, Math.min(146, player.x + vx * player.speed * dt));
  const nextY = Math.max(4, Math.min(144, player.y + vy * player.speed * dt));

  if (!pillars.some(w => aabb({x: nextX, y: player.y, w: player.w, h: player.h}, w))) player.x = nextX;
  if (!pillars.some(w => aabb({x: player.x, y: nextY, w: player.w, h: player.h}, w))) player.y = nextY;

  for (const e of enemies) {
    e.anim += dt;
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    e.x = Math.max(2, Math.min(148, e.x + ((dx / dist) * e.speed + e.knockX) * dt));
    e.y = Math.max(2, Math.min(146, e.y + ((dy / dist) * e.speed + e.knockY) * dt));
    e.knockX *= 0.82; e.knockY *= 0.82;

    if (aabb(player, e) && player.invuln <= 0) {
      player.hp = Math.max(0, player.hp - (e.type === 'knight' ? 15 : 8));
      player.invuln = 0.65;
      updateHUD();
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.y -= 14 * dt;
    ft.life -= dt;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }
}

function draw() {
  // Stone & Moss Arena Floor
  ctx.fillStyle = '#1e2d24';
  ctx.fillRect(0, 0, 160, 160);

  // Subtle Arena Border & Grass details
  ctx.strokeStyle = '#293d31';
  ctx.strokeRect(4, 4, 152, 152);
  ctx.fillStyle = '#2d4436';
  for (const g of grassTufts) {
    ctx.fillRect(g.x, g.y, 2, 2);
    ctx.fillRect(g.x + 2, g.y + 1, 1, 2);
  }

  // Ancient Stone Pillars
  for (const w of pillars) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(w.x + 2, w.y + w.h, w.w, 3);
    ctx.fillStyle = '#3f4756';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = '#64748b';
    ctx.fillRect(w.x, w.y, w.w, 4);
    ctx.fillStyle = '#475569';
    ctx.fillRect(w.x + 2, w.y + 6, w.w - 4, 2);
  }

  // Draw Enemies
  for (const e of enemies) drawHumanoidEnemy(e);

  // Draw Hero
  if (player.invuln <= 0 || Math.floor(player.invuln * 20) % 2 === 0) {
    drawHero(player.x, player.y);
  }

  // Draw Sword Slash Effect
  drawSwordSlash();

  // Draw Slash Particles
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
  }

  // Floating Damage & Gold Numbers
  ctx.font = 'bold 8px monospace';
  for (const ft of floatTexts) {
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y));
  }

  if (player.hp <= 0) {
    ctx.fillStyle = 'rgba(10, 10, 18, 0.82)';
    ctx.fillRect(0, 0, 160, 160);
    ctx.fillStyle = '#f87171';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('YOU FELL', 52, 72);
    ctx.fillStyle = '#fde047';
    ctx.font = '8px monospace';
    ctx.fillText('Tap SLASH to Revive', 34, 92);
  }
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
