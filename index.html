<!DOCTYPE html>
<html lang="en">
<head>

  <title>Pollux Action RPG</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0; background: #0b0c10; color: #fff;

    }
    canvas {
      width: 100%; height: 100%; display: block;
      background: #19261d; border: 2px solid #2a2f45;
      image-rendering: pixelated; image-rendering: crisp-edges;

    #shop-modal {
      display: none; position: absolute; inset: 12px;
      background: rgba(13, 15, 23, 0.97); border: 2px solid #facc15;

      justify-content: space-between; z-index: 10;

    #shop-modal.open { display: flex; }
    .shop-header {

    .buy-btn {
      background: #facc15; color: #111; border: none; padding: 5px 8px;

      width: 100%; max-width: 512px; display: flex; justify-content: space-between;
      align-items: center; padding: 8px 16px; background: #12141c;
    }

      background: #1f2333; border: 2px solid #3d4466; color: #fff;

      font-weight: bold; font-size: 15px; border-radius: 6px; touch-action: manipulation;
    }
    .btn:active { background: #ffb700; color: #000; }
    .action-cluster { display: flex; gap: 8px; align-items: center; }
    .dash-btn {
      width: 52px; height: 52px; border-radius: 50%; background: #1e3a8a;
      border: 2px solid #60a5fa; font-size: 11px; font-weight: bold; color: #93c5fd;
    }
    .atk-btn {
      width: 76px; height: 76px; border-radius: 50%; background: #991b1b;
      border: 3px solid #f87171; font-size: 13px; font-weight: bold;
      box-shadow: 0 0 10px rgba(248,113,113,0.3);
    }
  </style>

<body>

  <div id="hud">
    <div class="stats">
      <span class="hp-txt">♥ <span id="hp">100</span></span>
      <span class="gold-txt">🪙 <span id="gold">0</span>G</span>
      <span id="swordName" style="color:#fef08a;">Lv1 Blade</span>
    </div>

      <button class="shop-toggle" id="shopBtn">🛒 SHOP</button>

  <div id="game-wrap">

      </div>

      <div class="btn dash-btn" data-key="KeyDASH">DASH</div>
      <div class="btn atk-btn" data-key="Space">SLASH</div>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// --- 8-BIT AUDIO SYNTHESIZER ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let audioUnlocked = false;

function unlockAudio() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  audioUnlocked = true;
}
window.addEventListener('pointerdown', unlockAudio, { once: true });
window.addEventListener('keydown', unlockAudio, { once: true });

function playTone(freq, type, duration, vol) {
  if (!audioUnlocked || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxSlash() { playTone(800, 'triangle', 0.1, 0.1); setTimeout(() => playTone(1200, 'square', 0.1, 0.05), 40); }
function sfxDash() { playTone(300, 'sine', 0.2, 0.2); setTimeout(() => playTone(200, 'sine', 0.2, 0.1), 50); }
function sfxCoin() { playTone(1200, 'sine', 0.08, 0.1); setTimeout(() => playTone(1600, 'sine', 0.15, 0.1), 80); }
function sfxHit() { playTone(150, 'sawtooth', 0.15, 0.2); }
function sfxDeath() { playTone(100, 'sawtooth', 0.5, 0.3); setTimeout(() => playTone(80, 'square', 0.6, 0.3), 200); }


// --- PI NETWORK AUTHENTICATION ---
let sessionToken = null;
let verifiedUser = null;
let isAuthenticating = false;

async function authenticateWithPi() {
  if (isAuthenticating || sessionToken) return;
  const btn = document.getElementById('piLoginBtn');
  if (typeof window.Pi === 'undefined') { btn.textContent = "Guest"; return; }
  isAuthenticating = true;
  btn.textContent = "...";
  try {
    await window.Pi.init({ version: "2.0" });
    const authResult = await window.Pi.authenticate(["username"], () => {});
    const res = await fetch("https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com/pi/auth/v1/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accessToken: authResult.accessToken })
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    sessionToken = data.sessionToken;
    verifiedUser = data.user;
    btn.textContent = `@${verifiedUser.username}`;
    btn.style.background = "#4ade80";
  } catch (e) {
    btn.textContent = "Sign In"; isAuthenticating = false;
  }
}
window.addEventListener('DOMContentLoaded', authenticateWithPi);
document.getElementById('piLoginBtn').addEventListener('click', authenticateWithPi);

// --- SHOP & STATE ---
const SWORDS = [
  { level: 1, name: "Sunlit Shortsword", short: "Lv1 Blade", cost: 0, dmg: 1, reach: 15, color: "#fef9c3", glow: "#fde047" },
  { level: 2, name: "Crimson Edge", short: "Lv2 Crimson", cost: 30, dmg: 2, reach: 18, color: "#f87171", glow: "#dc2626" },
  { level: 3, name: "Azure Stormfang", short: "Lv3 Azure", cost: 85, dmg: 4, reach: 21, color: "#60a5fa", glow: "#2563eb" },
  { level: 4, name: "Void Pollux Relic", short: "MAX Void", cost: 220, dmg: 8, reach: 25, color: "#e879f9", glow: "#9333ea" }
];

const player = {
  x: 76, y: 76, w: 10, h: 14, speed: 64, dir: 'down',
  hp: 100, maxHp: 100, gold: 0, swordIdx: 0,
  atkTimer: 0, atkDuration: 0.2, combo: 0, comboTimer: 0,
  dashTimer: 0, dashCooldown: 0, invuln: 0, walkCycle: 0
};

const shopModal = document.getElementById('shop-modal');
const shopList = document.getElementById('shopList');

function updateHUD() {
  document.getElementById('hp').textContent = player.hp;
  document.getElementById('gold').textContent = player.gold;
  const sw = SWORDS[player.swordIdx];
  const swEl = document.getElementById('swordName');
  swEl.textContent = sw.short; swEl.style.color = sw.color;
}

function renderShop() {
  shopList.innerHTML = '';
  SWORDS.slice(1).forEach((s, idx) => {
    const actualIdx = idx + 1;
    const owned = player.swordIdx >= actualIdx;
    const canBuy = !owned && player.gold >= s.cost && player.swordIdx === actualIdx - 1;
    const locked = actualIdx > player.swordIdx + 1;
    const card = document.createElement('div'); card.className = 'shop-card';
    card.innerHTML = `<div class="item-info"><div class="item-title"><span class="color-dot" style="background:${s.color}; box-shadow: 0 0 6px ${s.glow};"></span><span style="color:${s.color}">${s.name}</span></div><div class="item-desc">DMG: ${s.dmg} | Slash Color</div></div><button class="buy-btn" ${(!canBuy || owned) ? 'disabled' : ''}>${owned ? 'OWNED' : locked ? 'LOCKED' : s.cost + 'G'}</button>`;
    if (canBuy) card.querySelector('button').addEventListener('click', () => { player.gold -= s.cost; player.swordIdx = actualIdx; updateHUD(); renderShop(); sfxCoin(); });
    shopList.appendChild(card);
  });
  const potionCard = document.createElement('div'); potionCard.className = 'shop-card';
  const canHeal = player.gold >= 15 && player.hp < player.maxHp;
  potionCard.innerHTML = `<div class="item-info"><div class="item-title" style="color:#4ade80;">🧪 Health Potion</div><div class="item-desc">Restores +50 HP</div></div><button class="buy-btn" ${!canHeal ? 'disabled' : ''}>15G</button>`;
  if (canHeal) potionCard.querySelector('button').addEventListener('click', () => { player.gold -= 15; player.hp = Math.min(player.maxHp, player.hp + 50); updateHUD(); renderShop(); sfxCoin(); });
  shopList.appendChild(potionCard);
}

document.getElementById('shopBtn').addEventListener('click', () => { renderShop(); shopModal.classList.toggle('open'); });
document.getElementById('closeShopBtn').addEventListener('click', () => { shopModal.classList.remove('open'); });

// --- INPUTS ---
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') triggerAttack();
  if (e.code === 'ShiftLeft' || e.code === 'KeyZ') triggerDash();
});
window.addEventListener('keyup', e => keys[e.code] = false);

document.querySelectorAll('.btn').forEach(btn => {
  const k = btn.dataset.key;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); unlockAudio();
    if (player.hp <= 0) { revivePlayer(); return; }
    if (k === 'KeyDASH') { triggerDash(); return; }
    keys[k] = true; if (k === 'Space') triggerAttack();
  });
  btn.addEventListener('pointerup', e => { e.preventDefault(); keys[k] = false; });
  btn.addEventListener('pointerleave', () => keys[k] = false);
});
canvas.addEventListener('pointerdown', () => { unlockAudio(); if (player.hp <= 0) revivePlayer(); });

function revivePlayer() {
  player.hp = 100; player.x = 76; player.y = 76;
  enemies.length = 0; coins.length = 0; hearts.length = 0;
  for (let i = 0; i < 4; i++) spawnEnemy();
  updateHUD();
}

// --- ENTITIES & SPAWNS ---
const enemies = []; const coins = []; const hearts = []; const particles = []; const floatTexts = []; const afterImages = [];
const pillars = [{x: 24, y: 24, w: 14, h: 16}, {x: 122, y: 24, w: 14, h: 16}, {x: 24, y: 120, w: 14, h: 16}, {x: 122, y: 120, w: 14, h: 16}];

function spawnEnemy() {
  if (enemies.length >= 7) return;
  const edge = Math.floor(Math.random() * 4);
  const x = edge === 0 ? 8 : edge === 1 ? 142 : Math.random() * 130 + 10;
  const y = edge === 2 ? 8 : edge === 3 ? 142 : Math.random() * 130 + 10;
  const rand = Math.random();
  const type = rand < 0.5 ? 'slime' : rand < 0.8 ? 'goblin' : 'brute';
  const hp = type === 'slime' ? 2 : type === 'goblin' ? 4 : 8;
  enemies.push({ x, y, w: type === 'slime' ? 8 : 10, h: type === 'slime' ? 8 : 14, type, hp, maxHp: hp, speed: type === 'slime' ? 28 : type === 'goblin' ? 22 : 14, goldValue: type === 'slime' ? 5 : type === 'goblin' ? 10 : 20, knockX: 0, knockY: 0, anim: Math.random() * 10, dir: 'down' });
}
for (let i = 0; i < 4; i++) spawnEnemy();

function aabb(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function triggerDash() {
  if (player.dashCooldown > 0 || player.dashTimer > 0 || player.hp <= 0 || shopModal.classList.contains('open')) return;
  sfxDash();
  player.dashTimer = 0.14; player.dashCooldown = 0.7; player.invuln = 0.25;
  for (let i = 0; i < 6; i++) particles.push({ x: player.x + 5, y: player.y + 6, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20, life: 0.2, color: '#60a5fa' });
}

function triggerAttack() {
  if (player.atkTimer > 0 || player.hp <= 0 || shopModal.classList.contains('open')) return;
  sfxSlash();
  player.atkTimer = player.atkDuration; player.comboTimer = 1.2; player.combo = (player.combo + 1) % 3;
  const sw = SWORDS[player.swordIdx];
  const reach = sw.reach + (player.combo === 2 ? 4 : 0);
  const dmgBonus = player.combo === 2 ? 2 : 0;
  const totalDmg = sw.dmg + dmgBonus;
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
  const hitbox = {
    x: player.dir === 'left' ? cx - reach : player.dir === 'right' ? cx + 2 : cx - reach * 0.7,
    y: player.dir === 'up' ? cy - reach : player.dir === 'down' ? cy + 2 : cy - reach * 0.7,
    w: (player.dir === 'left' || player.dir === 'right') ? reach : reach * 1.4,
    h: (player.dir === 'up' || player.dir === 'down') ? reach : reach * 1.4
  };

  for (let i = 0; i < 8; i++) particles.push({ x: hitbox.x + Math.random() * hitbox.w, y: hitbox.y + Math.random() * hitbox.h, vx: (Math.random() - 0.5) * 55, vy: (Math.random() - 0.5) * 55, life: 0.25, color: player.combo === 2 ? '#ffffff' : sw.color });

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (aabb(hitbox, e)) {
      sfxHit(); e.hp -= totalDmg;
      const dx = (e.x - player.x) || 1, dy = (e.y - player.y) || 1, len = Math.hypot(dx, dy);
      e.knockX = (dx / len) * 140; e.knockY = (dy / len) * 140;
      floatTexts.push({ x: e.x + 2, y: e.y - 2, text: `-${totalDmg}`, color: player.combo === 2 ? '#fff' : sw.color, life: 0.45 });
      if (e.hp <= 0) {
        if (Math.random() < 0.75) coins.push({ x: e.x + 2, y: e.y + 2, w: 4, h: 4, val: e.goldValue });
        if (Math.random() < 0.25) hearts.push({ x: e.x + 2, y: e.y + 2, w: 5, h: 5 });
        enemies.splice(i, 1); setTimeout(spawnEnemy, 850);
      }
    }
  }
}

// --- DETAILED PROCEDURAL RENDERING ---
function drawHero(x, y, alpha = 1) {
  const px = Math.round(x), py = Math.round(y);
  const sw = SWORDS[player.swordIdx];
  
  // Head Bobbing & Walk Cycle
  const isMoving = (keys['ArrowUp'] || keys['KeyW'] || keys['ArrowDown'] || keys['KeyS'] || keys['ArrowLeft'] || keys['KeyA'] || keys['ArrowRight'] || keys['KeyD']);
  const bob = isMoving ? Math.abs(Math.sin(player.walkCycle * 14)) * 1.5 : 0;
  const step = isMoving && Math.sin(player.walkCycle * 14) > 0 ? 1 : 0;

  ctx.globalAlpha = alpha;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(px + 1, py + 12, 8, 2);

  // Cape
  ctx.fillStyle = player.dashTimer > 0 ? '#3b82f6' : '#b91c1c';
  ctx.fillRect(px + 1, py + 4 + bob, 8, 6);

  // Legs (Animated Walk)
  ctx.fillStyle = '#475569';
  ctx.fillRect(px + 2, py + 10 - step, 2, 3 + step);
  ctx.fillRect(px + 6, py + 9 + step, 2, 4 - step);

  // Tunic/Armor Body
  ctx.fillStyle = '#2563eb';
  ctx.fillRect(px + 2, py + 5 + bob, 6, 5);
  ctx.fillStyle = '#eab308'; // Belt
  ctx.fillRect(px + 2, py + 8 + bob, 6, 1);

  // Hands & Arms (Flesh Color & Swinging)
  ctx.fillStyle = '#fca5a5'; 
  const atkOffset = player.atkTimer > 0 ? 3 : 0;
  if (player.dir === 'right') {
    ctx.fillRect(px + 5 + atkOffset, py + 7 + bob, 2, 2); // Front Hand
  } else if (player.dir === 'left') {
    ctx.fillRect(px + 3 - atkOffset, py + 7 + bob, 2, 2); // Front Hand
  } else {
    ctx.fillRect(px + 1 - step, py + 7 + bob, 2, 2); // Left Hand
    ctx.fillRect(px + 7 + step, py + 7 + bob, 2, 2); // Right Hand
  }

  // Knight Helmet / Head
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(px + 1, py + bob, 8, 5);
  if (player.dir !== 'up') {
    ctx.fillStyle = '#fde68a'; // Face slit
    ctx.fillRect(px + 2, py + 2 + bob, 6, 2);
    ctx.fillStyle = '#0f172a'; // Eyes
    const eyeDir = player.dir === 'left' ? -1 : player.dir === 'right' ? 1 : 0;
    ctx.fillRect(px + 3 + eyeDir, py + 2 + bob, 1, 1);
    ctx.fillRect(px + 6 + eyeDir, py + 2 + bob, 1, 1);
  }

  // Physical Sword Pivot
  if (player.atkTimer > 0) {
    const progress = 1 - (player.atkTimer / player.atkDuration);
    let baseAngle = player.dir === 'right' ? 0 : player.dir === 'down' ? Math.PI/2 : player.dir === 'left' ? Math.PI : -Math.PI/2;
    const currentAngle = (baseAngle - 1.2) + (2.4 * progress);
    
    ctx.save();
    ctx.translate(px + 5, py + 8 + bob);
    ctx.rotate(currentAngle);
    // Sword Handle
    ctx.fillStyle = '#78350f';
    ctx.fillRect(0, -1, 3, 2);
    // Sword Blade
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(3, -1, 8, 2);
    // Blade Glow Edge
    ctx.fillStyle = sw.color;
    ctx.fillRect(4, 0, 7, 1);
    ctx.restore();
  }

  ctx.globalAlpha = 1;
}

function drawEnemy(e) {
  const ex = Math.round(e.x), ey = Math.round(e.y);
  const isMoving = Math.abs(e.knockX) > 1 || Math.abs(e.knockY) > 1 || e.hp > 0;
  const bob = isMoving ? Math.abs(Math.sin(e.anim * 12)) * 1.5 : 0;
  const step = isMoving && Math.sin(e.anim * 12) > 0 ? 1 : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(ex + 1, ey + e.h - 2, e.w - 2, 2);

  if (e.type === 'slime') {
    ctx.fillStyle = '#10b981';
    ctx.fillRect(ex + 1, ey + 2 - bob, 6, 6 + bob);
    ctx.fillStyle = '#6ee7b7'; // Eyes
    ctx.fillRect(ex + 2, ey + 4 - bob, 1, 2);
    ctx.fillRect(ex + 5, ey + 4 - bob, 1, 2);
  } else if (e.type === 'goblin') {
    ctx.fillStyle = '#65a30d'; // Head
    ctx.fillRect(ex + 2, ey + 1 + bob, 6, 4);
    ctx.fillStyle = '#ef4444'; // Red Eyes
    ctx.fillRect(ex + 3, ey + 2 + bob, 1, 1); ctx.fillRect(ex + 6, ey + 2 + bob, 1, 1);
    ctx.fillStyle = '#78350f'; // Body
    ctx.fillRect(ex + 2, ey + 5 + bob, 6, 5);
    ctx.fillStyle = '#3f6212'; // Legs
    ctx.fillRect(ex + 2, ey + 10 - step, 2, 3 + step);
    ctx.fillRect(ex + 6, ey + 9 + step, 2, 4 - step);
    // Goblin Dagger Hand
    ctx.fillStyle = '#84cc16';
    ctx.fillRect(ex - 1, ey + 7 + bob, 2, 2);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(ex - 1, ey + 5 + bob, 1, 3);
  } else {
    // Brute Orc
    ctx.fillStyle = '#b45309';
    ctx.fillRect(ex + 1, ey + bob, 8, 6);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(ex + 2, ey + 2 + bob, 2, 2); ctx.fillRect(ex + 6, ey + 2 + bob, 2, 2);
    ctx.fillStyle = '#451a03';
    ctx.fillRect(ex, ey + 6 + bob, 10, 6);
    ctx.fillStyle = '#1c1917'; // Heavy Legs
    ctx.fillRect(ex + 1, ey + 12 - step, 3, 3 + step);
    ctx.fillRect(ex + 6, ey + 11 + step, 3, 4 - step);
  }

  if (e.hp < e.maxHp) {
    ctx.fillStyle = '#111'; ctx.fillRect(ex, ey - 4, e.w, 2);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(ex, ey - 4, Math.ceil((e.hp / e.maxHp) * e.w), 2);
  }
}

function drawSlashArc() {
  if (player.atkTimer <= 0) return;
  const sw = SWORDS[player.swordIdx];
  const progress = 1 - (player.atkTimer / player.atkDuration);
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
  let baseAngle = player.dir === 'right' ? 0 : player.dir === 'down' ? Math.PI/2 : player.dir === 'left' ? Math.PI : -Math.PI/2;
  const startArc = baseAngle - 1.2, endArc = baseAngle + 1.2;
  const currentAngle = startArc + (endArc - startArc) * progress;

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, sw.reach, startArc, currentAngle);
  ctx.strokeStyle = player.combo === 2 ? '#ffffff' : sw.glow;
  ctx.lineWidth = player.combo === 2 ? 8 : 5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, sw.reach - 2, startArc + 0.2, currentAngle);
  ctx.strokeStyle = sw.color; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

// --- GAME LOOP ---
let lastTime = performance.now();
function update(dt) {
  if (player.hp <= 0) {
    if (player.hp === 0 && !player.dead) { sfxDeath(); player.dead = true; }
    return;
  }
  player.dead = false;
  if (shopModal.classList.contains('open')) return;

  if (player.atkTimer > 0) player.atkTimer -= dt;
  if (player.dashTimer > 0) {
    player.dashTimer -= dt;
    if (Math.random() < 0.5) afterImages.push({ x: player.x, y: player.y, life: 0.2 });
  }
  if (player.dashCooldown > 0) player.dashCooldown -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (player.comboTimer > 0) { player.comboTimer -= dt; if (player.comboTimer <= 0) player.combo = 0; }

  let vx = 0, vy = 0;
  if (keys['ArrowUp'] || keys['KeyW']) { vy = -1; player.dir = 'up'; }
  if (keys['ArrowDown'] || keys['KeyS']) { vy = 1; player.dir = 'down'; }
  if (keys['ArrowLeft'] || keys['KeyA']) { vx = -1; player.dir = 'left'; }
  if (keys['ArrowRight'] || keys['KeyD']) { vx = 1; player.dir = 'right'; }
  if (vx !== 0 || vy !== 0) { player.walkCycle += dt; if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; } }

  const currentSpeed = player.dashTimer > 0 ? player.speed * 2.8 : player.speed;
  const nextX = Math.max(4, Math.min(146, player.x + vx * currentSpeed * dt));
  const nextY = Math.max(4, Math.min(144, player.y + vy * currentSpeed * dt));

  if (!pillars.some(w => aabb({x: nextX, y: player.y, w: player.w, h: player.h}, w))) player.x = nextX;
  if (!pillars.some(w => aabb({x: player.x, y: nextY, w: player.w, h: player.h}, w))) player.y = nextY;

  for (const e of enemies) {
    e.anim += dt;
    const dx = player.x - e.x, dy = player.y - e.y, dist = Math.hypot(dx, dy) || 1;
    if (dist > 10) { e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
    e.x = Math.max(2, Math.min(148, e.x + ((dx / dist) * e.speed + e.knockX) * dt));
    e.y = Math.max(2, Math.min(146, e.y + ((dy / dist) * e.speed + e.knockY) * dt));
    e.knockX *= 0.82; e.knockY *= 0.82;

    if (aabb(player, e) && player.invuln <= 0 && player.dashTimer <= 0) {
      sfxHit();
      player.hp = Math.max(0, player.hp - (e.type === 'brute' ? 15 : e.type === 'goblin' ? 10 : 5));
      player.invuln = 0.7; updateHUD();
    }
  }

  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    if (aabb(player, c)) { sfxCoin(); player.gold += c.val; floatTexts.push({ x: c.x, y: c.y - 6, text: `+${c.val}G`, color: '#fde047', life: 0.5 }); coins.splice(i, 1); updateHUD(); }
  }

  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    if (aabb(player, h)) { sfxCoin(); player.hp = Math.min(player.maxHp, player.hp + 20); floatTexts.push({ x: h.x, y: h.y - 6, text: `+20 ♥`, color: '#f87171', life: 0.5 }); hearts.splice(i, 1); updateHUD(); }
  }

  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) particles.splice(i, 1); }
  for (let i = floatTexts.length - 1; i >= 0; i--) { const ft = floatTexts[i]; ft.y -= 12 * dt; ft.life -= dt; if (ft.life <= 0) floatTexts.splice(i, 1); }
  for (let i = afterImages.length - 1; i >= 0; i--) { const ai = afterImages[i]; ai.life -= dt; if (ai.life <= 0) afterImages.splice(i, 1); }
}

function draw() {
  ctx.fillStyle = '#19261d'; ctx.fillRect(0, 0, 160, 160);
  ctx.strokeStyle = '#223528'; ctx.strokeRect(4, 4, 152, 152);

  for (const w of pillars) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(w.x + 2, w.y + w.h, w.w, 3);
    ctx.fillStyle = '#3f4756'; ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = '#64748b'; ctx.fillRect(w.x, w.y, w.w, 4);
  }

  for (const c of coins) { ctx.fillStyle = '#facc15'; ctx.fillRect(Math.round(c.x), Math.round(c.y), 4, 4); }
  for (const h of hearts) { ctx.fillStyle = '#f87171'; ctx.fillRect(Math.round(h.x), Math.round(h.y), 5, 5); }

  for (const e of enemies) drawEnemy(e);
  for (const ai of afterImages) drawHero(ai.x, ai.y, ai.life * 2); // Dash trails

  if (player.invuln <= 0 || Math.floor(player.invuln * 20) % 2 === 0) drawHero(player.x, player.y);
  
  drawSlashArc();

  for (const p of particles) { ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
  ctx.font = 'bold 8px monospace';
  for (const ft of floatTexts) { ctx.fillStyle = ft.color; ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y)); }

  if (player.hp <= 0) {
    ctx.fillStyle = 'rgba(11, 12, 16, 0.85)'; ctx.fillRect(0, 0, 160, 160);
    ctx.fillStyle = '#f87171'; ctx.font = 'bold 11px monospace'; ctx.fillText('DEFEATED', 50, 72);
    ctx.fillStyle = '#fde047'; ctx.font = '8px monospace'; ctx.fillText('Tap SLASH to Respawn', 28, 90);
  }
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now; update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
